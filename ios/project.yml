name: Lifeblood
options:
  bundleIdPrefix: au.lifeblood
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  Lifeblood:
    type: application
    platform: iOS
    sources: [Lifeblood]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LIFEBLOOD
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: Export reminders you choose to your calendar.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.lifeblood.tracker
  LifebloodTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LifebloodTests]
    dependencies:
      - target: Lifeblood
schemes:
  Lifeblood:
    build:
      targets:
        Lifeblood: all
    test:
      targets: [LifebloodTests]
